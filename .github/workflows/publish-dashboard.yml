# Publish the marketplace scoreboard to GitHub Pages.
#
# GitHub Pages serves the gh-pages branch directly (Settings -> Pages -> Deploy from
# a branch: gh-pages, /). The scoreboard is therefore just files on that branch,
# and there are two ways to put a run there:
#
#   1. This workflow. On every push to main, weekly, and on manual dispatch it runs
#      the full evaluation when the repository holds a model credential, then
#      appends the run to gh-pages with evalkit.pages. Credentials, checked in
#      `preflight`:
#        EVAL_ROLE_ARN                Bedrock through GitHub OIDC (the PR workflow's
#                                     role; trust must also accept ref:refs/heads/main)
#        EVAL_OPENAI_API_KEY          any OpenAI-compatible endpoint, optionally with
#        EVAL_OPENAI_BASE_URL         EVAL_MODEL_ID / EVAL_JUDGE_MODEL_ID variables
#      With neither, `eval` is skipped and `publish` only rebuilds the site from the
#      existing history and main's eval-baseline.json. Nothing goes red.
#   2. tools/publish_scoreboard.py, from a laptop with its own AWS profile. Same
#      site builder, same branch; no repository secret needed.
#
# Only an allowlist of evidence is published (evalkit.pages.allowed): report and
# run JSON, execute logs, image previews under 2 MB. Everything on Pages is public.

name: publish-dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Publishes append to gh-pages; never run two at once, never cancel one midway.
concurrency:
  group: publish-dashboard
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.1"
  AWS_DEFAULT_REGION: us-east-1

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.pick.outputs.provider }}
    steps:
      - id: pick
        env:
          HAS_AWS: ${{ secrets.EVAL_ROLE_ARN != '' }}
          HAS_OPENAI: ${{ secrets.EVAL_OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_AWS" = "true" ]; then provider=bedrock
          elif [ "$HAS_OPENAI" = "true" ]; then provider=openai
          else provider=none; fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "Model provider for this run: $provider"

  eval:
    needs: preflight
    if: needs.preflight.outputs.provider != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MODEL_PROVIDER: ${{ needs.preflight.outputs.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: needs.preflight.outputs.provider == 'bedrock'
        run: uv sync --locked
      - if: needs.preflight.outputs.provider == 'openai'
        run: uv sync --locked --extra openai
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - if: needs.preflight.outputs.provider == 'bedrock'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.EVAL_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - if: needs.preflight.outputs.provider == 'openai'
        run: |
          {
            echo "OPENAI_API_KEY=${{ secrets.EVAL_OPENAI_API_KEY }}"
            [ -n "${{ secrets.EVAL_OPENAI_BASE_URL }}" ] && echo "OPENAI_BASE_URL=${{ secrets.EVAL_OPENAI_BASE_URL }}"
            [ -n "${{ vars.EVAL_MODEL_ID }}" ] && echo "MODEL_ID=${{ vars.EVAL_MODEL_ID }}"
            [ -n "${{ vars.EVAL_JUDGE_MODEL_ID }}" ] && echo "JUDGE_MODEL_ID=${{ vars.EVAL_JUDGE_MODEL_ID }}"
            true
          } >> "$GITHUB_ENV"
      - run: uv run --locked python -m evalkit.github_ci
      - if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: uv run --locked python -m evalkit.ci_report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-evaluation
          path: .eval/
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: [preflight, eval]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: needs.eval.result != 'skipped'
        uses: actions/download-artifact@v4
        # A lost runner may have produced no artifact; publish still rebuilds the site.
        continue-on-error: true
        with:
          name: skill-evaluation
          path: .eval
      - name: Check out gh-pages as the history store
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
      # evalkit.pages is standard library only; no project environment needed here.
      - run: python -m evalkit.pages --site site --run .eval
      - name: Commit to gh-pages
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged"
          else
            git -c user.name=github-actions[bot] \
                -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit -m "scoreboard: ${GITHUB_SHA::7} (${GITHUB_EVENT_NAME}, provider ${{ needs.preflight.outputs.provider }})"
            git push origin gh-pages
          fi
      - run: echo "Scoreboard https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
